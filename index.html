<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>BracketRanker</title>
<style>
:root{--bg:#0b1020;--card:#121a33;--ink:#e7ecff;--muted:#95a0c6;--accent:#7dd3fc;--right:#34d399;--focus:#fbbf24}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#0b1020,#0a0f24 60%);color:var(--ink);font:16px/1.45 system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:18px;display:grid;gap:18px}
.card{background:var(--card);border:1px solid #1d274a;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.25);padding:16px}
input,textarea{width:100%;padding:12px 14px;border-radius:10px;border:1px solid #2a3a6a;background:#0a1430;color:var(--ink)}
button{padding:12px 14px;border-radius:10px;border:1px solid #2a3a6a;background:#0e1a3d;color:var(--ink);cursor:pointer}
button:hover{filter:brightness(1.08)}
.row{display:flex;gap:10px;align-items:center}
.grid{display:grid;gap:10px}
.two{grid-template-columns:1fr 1fr}
.pill{height:8px;background:#0a1430;border:1px solid #23325e;border-radius:999px;overflow:hidden}
.bar{height:100%;width:0;background:linear-gradient(90deg,var(--accent),#60a5fa);transition:width .3s}
.bracket{display:grid;grid-auto-flow:column;gap:12px;overflow:auto}
.round{display:grid;gap:8px;min-width:220px}
.match{background:#0b1533;border:1px solid #1d274a;border-radius:12px;padding:10px}
.seed{font:12px/1 ui-monospace,Menlo,Consolas,monospace;color:var(--muted)}
.entry{margin:6px 0;padding:8px;border-radius:8px;border:1px solid #2a3a6a;cursor:pointer}
.entry.active{outline:2px solid var(--focus)}
.entry.win{background:#0e1f3d}
.bracket {
  display: flex;
  justify-content: space-between;
  gap: 40px;
  overflow-x: auto;
  padding: 20px 0;
}

.round {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-around;
  gap: 40px;
  position: relative;
}

.match {
  background: #111a33;
  border: 1px solid #1d274a;
  border-radius: 10px;
  padding: 10px;
  width: 180px;
  text-align: center;
  position: relative;
}

.entry {
  margin: 6px 0;
  padding: 8px;
  border-radius: 8px;
  border: 1px solid #2a3a6a;
  cursor: pointer;
  transition: all 0.2s;
}

.entry:hover {
  background-color: #182550;
}

.entry.win {
  background-color: #1b295a;
  border-color: #3b82f6;
  box-shadow: 0 0 6px rgba(59,130,246,0.5);
}

.round::after {
  content: '';
  position: absolute;
  right: -20px;
  top: 0;
  bottom: 0;
  width: 2px;
  background: #25325c;
}
.round:last-child .match { box-shadow: 0 0 0 2px rgba(125,211,252,.25) inset; }
.round:last-child .entry.win { box-shadow: 0 0 10px rgba(125,211,252,.45); }

/* Read-only mode styling */
.bracket.readonly .entry {
  cursor: default;
}
.bracket.readonly .entry:hover {
  background-color: inherit;
}
.review-banner {
  background: linear-gradient(90deg, #1e3a5f, #2d4a6f);
  border: 1px solid #3b82f6;
  border-radius: 10px;
  padding: 12px 16px;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--accent);
}
.review-banner .icon {
  font-size: 20px;
}
.review-banner .text {
  flex: 1;
}

/* Entry thumbnails inside the bracket */
.entry { display: flex; align-items: center; gap: 8px; }
.entry-name { flex: 1; }
.entry-img {
  width: 28px; height: 28px; border-radius: 6px;
  object-fit: cover; flex: 0 0 auto; background: #0a1430;
  cursor: zoom-in;
}

/* Fullscreen image lightbox */
.lightbox {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  width: 100%; height: 100%;
  z-index: 1000;
  background: rgba(3, 6, 18, 0.92);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 14px;
  padding: 24px; cursor: zoom-out;
  overscroll-behavior: contain;
}
.lightbox img {
  max-width: 92vw; max-height: 82vh;
  border-radius: 12px; object-fit: contain;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
}
.lightbox .cap {
  color: var(--ink); font-size: 18px; font-weight: 600;
  text-align: center; max-width: 92vw;
}

/* Create-bracket entry rows */
.entry-row {
  display: flex; align-items: center; gap: 8px;
  border: 1px solid #1d274a; border-radius: 10px; padding: 8px;
  background: #0b1533;
}
.entry-row.dragover { border-color: var(--accent); background: #11214a; }
.entry-row .name { flex: 1; }
.entry-row .url { flex: 1.2; }
.entry-row .thumb {
  width: 44px; height: 44px; border-radius: 8px; object-fit: cover;
  flex: 0 0 auto; border: 1px solid #2a3a6a; background: #0a1430;
}
.entry-row .filebtn {
  white-space: nowrap; padding: 8px 10px; font-size: 14px;
}
.entry-row .removebtn {
  flex: 0 0 auto; border-color: #5a2a3a; color: #f4a8bd;
}
</style>
</head>

<div class="wrap">
<div class="card">
<h1>🏆 BracketLab</h1>
<div class="row">
<input id="codeInput" placeholder="Enter code (or leave empty to create)" />
<button id="loadBtn">Create</button>
</div>
</div>


<div id="createCard" class="card" style="display:none">
<h2>Create a bracket</h2>
<label>Question</label>
<input id="question" placeholder="Which animal would win in a race?" />
<label>Entries</label>
<div id="entryList" class="grid"></div>
<button id="addEntryBtn" type="button" style="margin-top:8px">+ Add entry</button>
<div class="row" style="margin-top:12px">
<button id="createBtn">Create</button>

</div>


<div id="playCard" class="card" style="display:none">
<h2 id="qText"></h2>
<div id="reviewBanner" class="review-banner" style="display:none">
<span class="icon">👁️</span>
<span class="text">You're viewing your submitted bracket. Picks cannot be changed.</span>
</div>
<div class="bracket" id="bracket"></div>
<div class="row" style="margin-top:10px">
<button id="submitBtn">Submit</button>
<div id="playMsg" style="margin-left:8px;color:var(--muted)"></div>
</div>
</div>


<div id="statsCard" class="card" style="display:none">
<h2>📊 Aggregate stats</h2>
<div id="stats"></div>
</div>


<div id="browseCard" class="card" style="display:none">
<h2>🔎 Recent brackets</h2>
<ul id="recent" style="list-style:none;padding:0;margin:0"></ul>
</div>
</div>


<div id="lightbox" class="lightbox" style="display:none">
<img id="lightboxImg" alt="" />
<div id="lightboxCaption" class="cap"></div>
</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>

const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRrcGtoZW9vb3F2aW50dXBicXpkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzMjUzMTksImV4cCI6MjA5NTkwMTMxOX0.wK2ZpN0YwL0BK5QQl6_1mmpqPJ_J81hJ4FbthCZngHc';
const IMAGE_BUCKET = 'entry-images';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// === BEGIN player ID persistence ===
function getPlayerId() {
  try {
    let id = localStorage.getItem('br_player_id');
    if (!id) {
      id = 'p_' + Date.now().toString(36) + '_' + Math.random().toString(36).substring(2, 10);
      localStorage.setItem('br_player_id', id);
    }
    return id;
  } catch (e) {
    // If localStorage unavailable, generate a session-only ID
    return 'p_' + Date.now().toString(36) + '_' + Math.random().toString(36).substring(2, 10);
  }
}
const PLAYER_ID = getPlayerId();
// === END player ID persistence ===


// === BEGIN localStorage helpers for picks ===
function rememberPicks(code, ranking, bracket){
  try {
    localStorage.setItem(`br_submitted_${code}`, '1');
    localStorage.setItem(`br_ranking_${code}`, JSON.stringify(ranking));
    if (bracket) {
      localStorage.setItem(`br_bracket_${code}`, JSON.stringify(bracket));
    }
  } catch (e) {
    // localStorage might be unavailable in some environments; fail silently
  }
}

function hasSubmitted(code){
  try {
    return localStorage.getItem(`br_submitted_${code}`) === '1';
  } catch (e) {
    return false;
  }
}

function getSavedRanking(code){
  try {
    const raw = localStorage.getItem(`br_ranking_${code}`);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch (e) {
    return null;
  }
}

function getSavedBracket(code){
  try {
    const raw = localStorage.getItem(`br_bracket_${code}`);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch (e) {
    return null;
  }
}
// === END localStorage helpers for picks ===

// === Supabase data layer (replaces the old Apps Script apiGet/apiPost) ===

// 5-char base36 share code (ported from the old AppScript genCode()).
function genCode(){
  const n = Date.now() + Math.floor(Math.random()*1e6);
  return n.toString(36).toUpperCase().slice(-5);
}

// Normalize an entry to { name, img }. Tolerates legacy plain-string entries.
function normEntry(e){
  if (e == null) return null;
  if (typeof e === 'string') return { name: e, img: null };
  if (typeof e.name === 'string') return { name: e.name, img: e.img || null };
  return null;
}

async function fetchSet(code){
  const { data, error } = await sb.from('sets')
    .select('code, question, entries').eq('code', code).maybeSingle();
  if (error || !data) return { ok:false, error:'NOT_FOUND' };
  const entries = (data.entries || []).map(normEntry).filter(Boolean);
  return { ok:true, code:data.code, question:data.question, entries };
}

async function fetchMyPicks(code, playerId){
  if (!code || !playerId) return { ok:true, found:false };
  const { data, error } = await sb.from('picks')
    .select('bracket, ranking').eq('code', code).eq('player_id', playerId).maybeSingle();
  if (error || !data) return { ok:true, found:false };
  return { ok:true, found:true, bracket:data.bracket, ranking:data.ranking || [] };
}

// Aggregation ported from the old AppScript doGet 'stats'.
async function fetchStats(code){
  const { data, error } = await sb.from('picks').select('score, ranking').eq('code', code);
  if (error) return { ok:false };
  if (!data || !data.length) return { ok:true, code, total:0, aggregate:[] };

  const aggScores = new Map();
  const rankTallies = new Map(); // entry -> list of ranks
  data.forEach(r => {
    for (const [k,v] of Object.entries(r.score || {})) {
      aggScores.set(k, (aggScores.get(k)||0) + Number(v||0));
    }
    (r.ranking || []).forEach((entry, i) => {
      const arr = rankTallies.get(entry) || [];
      arr.push(i+1); // 1-based rank
      rankTallies.set(entry, arr);
    });
  });

  const aggregate = Array.from(aggScores.entries()).map(([entry, totalScore]) => {
    const ranks = rankTallies.get(entry) || [];
    const avgRank = ranks.length ? (ranks.reduce((a,b)=>a+b,0)/ranks.length) : null;
    return { entry, totalScore, avgRank, samples: ranks.length };
  }).sort((a,b)=> (b.totalScore - a.totalScore) || ((a.avgRank||1e9) - (b.avgRank||1e9)) );

  return { ok:true, code, total: data.length, aggregate };
}

async function fetchBrowse(){
  const { data, error } = await sb.from('sets')
    .select('code, question, entries, created_at')
    .order('created_at', { ascending:false }).limit(50);
  if (error) return { ok:false };
  const rows = (data || []).map(r => ({
    code: r.code,
    question: r.question,
    entries: (r.entries || []).map(normEntry).filter(Boolean),
    created_at: r.created_at
  }));
  return { ok:true, rows };
}

// Insert a new set, retrying on code collision (Postgres unique-violation 23505).
async function createSet(question, entries){
  for (let i=0; i<5; i++){
    const code = genCode();
    const { error } = await sb.from('sets').insert({ code, question, entries });
    if (!error) return { ok:true, code };
    if (error.code !== '23505') return { ok:false, error: error.message };
  }
  return { ok:false, error:'Could not generate a unique code.' };
}

async function submitPicks(code, playerId, bracket, ranking, scores){
  const { data, error } = await sb.from('picks')
    .insert({ code, player_id:playerId, bracket, ranking, score:scores })
    .select('pick_id').single();
  if (error) {
    // 23505 = already submitted (unique on code, player_id)
    return { ok:false, error: error.message, code: error.code, duplicate: error.code === '23505' };
  }
  return { ok:true, pick_id: data.pick_id };
}


// deterministic shuffle by seed
function mulberry32(a){return function(){var t=a+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return ((t^t>>>14)>>>0)/4294967296}}
function strHash(s){let h=2166136261; for(let i=0;i<s.length;i++){h^=s.charCodeAt(i); h=Math.imul(h,16777619);} return h>>>0;}
function seededShuffle(arr, seed){const r=mulberry32(seed); const a=arr.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(r()* (i+1)); [a[i],a[j]]=[a[j],a[i]];} return a;}


// bracket build (single-elim, pad with byes)
function buildBracket(entries, seedStr){
  //const seed = strHash(seedStr);
  const seed = Math.floor(Math.random() * 0xffffffff); 
  const shuffled = seededShuffle(entries, seed);
  // power-of-two pad
  let n=1; while(n<shuffled.length) n<<=1;

  // === BEGIN random bye distribution (no bye-vs-bye in Round 1) ===
  const byeCount = n - shuffled.length;

  // Edge case: if no byes, just fill straight across
  if (byeCount === 0) {
    const round0 = Array.from({length:n}, (_,i) => ({
      entry: shuffled[i] ?? null,
      win: null
    }));
    // Build subsequent rounds (same logic as below)
    const rounds = [round0];
    while(rounds[rounds.length-1].length > 1){
      const prev = rounds[rounds.length-1];
      const next = [];
      for(let i=0; i<prev.length; i+=2){
        next.push({left: prev[i], right: prev[i+1], win: null});
      }
      rounds.push(next);
    }
    return rounds;
}

// We’ll choose distinct first-round *pairs* to host byes,
// then pick a random side within each chosen pair.

// number of first-round pairs
const pairCount = n / 2;

// Build [0..pairCount-1], shuffle with seed
const pairIdxs = Array.from({length: pairCount}, (_,i)=>i);
const shuffledPairs = seededShuffle(pairIdxs, seed ^ 0x9e3779b9);

// Select the first `byeCount` pairs (guarantees ≤ 1 bye per pair)
const chosenPairs = new Set(shuffledPairs.slice(0, byeCount));

// Decide a side (top=0 or bottom=1) per chosen pair, using seeded RNG
const rng = mulberry32(seed ^ 0x85ebca6b);
const byeSlots = new Set();
chosenPairs.forEach(p => {
  const side = (rng() < 0.5 ? 0 : 1);
  const slotIndex = p * 2 + side; // map pair→slot
  byeSlots.add(slotIndex);
});

// Fill slots: put null in bye slots, and stream entries into the rest
const round0 = Array.from({length:n}, (_,i) => byeSlots.has(i) ? null : 'FILL');
const entriesIter = shuffled[Symbol.iterator]();
for (let i = 0; i < n; i++) {
  if (round0[i] === 'FILL') round0[i] = entriesIter.next().value ?? null;
}

// Wrap into node objects
for (let i = 0; i < n; i++) round0[i] = { entry: round0[i], win: null };
// === END random bye distribution (no bye-vs-bye in Round 1) ===


const rounds = [round0];
while(rounds[rounds.length-1].length>1){
const prev = rounds[rounds.length-1];
const next = [];
for(let i=0;i<prev.length;i+=2){ next.push({left:prev[i], right:prev[i+1], win:null}); }
rounds.push(next);
}
return rounds; // rounds[0] leaves, rounds[last] root array of size 1
}


function renderBracket(rootEl, data, fromSaved, readOnly = false, imgByName = {}){
  rootEl.innerHTML='';

  // === BEGIN support for saved bracket cols ===
  let cols;

  if (fromSaved) {
    // data is already the cols structure we serialized before
    cols = JSON.parse(JSON.stringify(data));
  } else {
    const rounds = data;
    cols = [];

    // Convert leaf nodes into pair matches
    const leaves = rounds[0];
    const r1 = [];
    for (let i = 0; i < leaves.length; i += 2) {
      r1.push({ a: leaves[i], b: leaves[i+1], pick: null });
    }
    cols.push(r1);

    // subsequent rounds
    for (let k = 1; k < rounds.length; k++) {
      const prev = cols[k-1];
      const cur = [];
      for (let i = 0; i < prev.length; i += 2) {
        cur.push({ a: prev[i], b: prev[i+1], pick: null });
      }
      cols.push(cur);
    }
  }


  function isEmpty(node){ return node === 'undefined'; }          // not decided/placed yet
  function isBye(node){ return node && node.entry === null; }   // explicit bye
  function hasEntry(node){ return node && node.entry != null; } // real name present

  function label(node){
    // undefined → blank (pending); null → "— bye —"; otherwise the entry string
    if (isEmpty(node)) return '';
    if (isBye(node)) return '— bye —';
    if (!node || node.entry === undefined || node.entry === null) return '';
    return String(node.entry ?? '');
  }

  // Build an .entry element with an optional image thumbnail (looked up by name).
  function makeEntry(name){
    const div = document.createElement('div');
    div.className = 'entry';
    const img = name ? imgByName[name] : null;
    if (img) {
      const im = document.createElement('img');
      im.className = 'entry-img';
      im.src = img;
      im.alt = name;
      im.loading = 'lazy';
      im.title = 'Click to enlarge';
      // Enlarge instead of registering a winner pick.
      im.onclick = (e) => { e.stopPropagation(); openLightbox(img, name); };
      div.appendChild(im);
    }
    const span = document.createElement('span');
    span.className = 'entry-name';
    span.textContent = name;
    div.appendChild(span);
    return div;
  }

  function placeWinner(roundIdx, matchIdx, winnerLabel){
    const nextCol = cols[roundIdx + 1];
    if (!nextCol) return;                          // no next round
    const nextMatch = nextCol[Math.floor(matchIdx / 2)];
    const side = (matchIdx % 2 === 0) ? 'a' : 'b'; // even → a, odd → b
    nextMatch[side] = { entry: winnerLabel, pick: null };
  }

  function pickAndAdvance(roundIdx, matchIdx, pickSide, m){
    m.pick = pickSide;
    const winnerLabel = label(pickSide === 'a' ? m.a : m.b);
    placeWinner(roundIdx, matchIdx, winnerLabel);
    update();
  }

  function update(){
  rootEl.innerHTML='';
  cols.forEach((matches, colIdx)=>{
  const col = document.createElement('div'); col.className='round';
  matches.forEach((m, i)=>{
  const card = document.createElement('div'); card.className='match';
  const e1 = makeEntry(label(m.a));
  const e2 = makeEntry(label(m.b));


  if (isBye(m.a) && hasEntry(m.b)) m.pick = 'b';
  if (isBye(m.b) && hasEntry(m.a)) m.pick = 'a';

  // If a pick exists (either by user click or valid bye auto-pick), advance winner
  if (m.pick === 'a' || m.pick === 'b') {
    placeWinner(colIdx, i, label(m[m.pick]));
  }

  // apply selected styles
  if (m.pick === 'a') e1.classList.add('win');
  if (m.pick === 'b') e2.classList.add('win');

  // click → set pick and advance (even index → nextMatch.a, odd index → nextMatch.b)
  if (!readOnly) {
    e1.onclick = () => pickAndAdvance(colIdx, i, 'a', m);
    e2.onclick = () => pickAndAdvance(colIdx, i, 'b', m);
  } else {
    e1.style.cursor = 'default';
    e2.style.cursor = 'default';
  }


  const isFinal = (colIdx === cols.length - 1);
  const heading = isFinal ? 'Champion' : `Round ${colIdx+1}`;
  card.innerHTML = `<div class="seed">${heading}</div>`;

  // === BEGIN champion render logic (single slot only if other side is bye/pending) ===
  const aHas = hasEntry(m.a);      // real name
  const bHas = hasEntry(m.b);
  const aBye = isBye(m.a);
  const bBye = isBye(m.b);

  // final should be single-slot only if exactly one side is a real entry,
  // and the other side is either a bye or still pending (undefined)
  const singleFinal = isFinal && (
    (aHas && !bHas) || (bHas && !aHas) || (aHas && bBye) || (bHas && aBye)
  );

  if (singleFinal) {
    const winnerName =
      (m.pick === 'a' && aHas) ? label(m.a) :
      (m.pick === 'b' && bHas) ? label(m.b) :
      aHas ? label(m.a) : bHas ? label(m.b) : '';

    const single = makeEntry(winnerName || '');
    single.classList.add('win');
    card.appendChild(single);
  } else {
    // normal: show both sides so user can click a final
    card.appendChild(e1);
    card.appendChild(e2);
  }
  col.appendChild(card);
  });
  rootEl.appendChild(col);
  });
  }
  update();


  return {
  getWinner(){
    const last = cols[cols.length - 1][0];
    if (!last) return null;

    if (last.pick === 'a') return label(last.a) || null;
    if (last.pick === 'b') return label(last.b) || null;

    const aHas = hasEntry(last.a);
    const bHas = hasEntry(last.b);
    const aBye = isBye(last.a);
    const bBye = isBye(last.b);

    // If exactly one real entry exists (other side pending or bye), that entry is champ
    if (aHas && (!bHas || bBye)) return label(last.a) || null;
    if (bHas && (!aHas || aBye)) return label(last.b) || null;

    return null; // both sides pending or both real but no pick yet
  },
  getRanking(){
  // Round-1 entries (ground truth universe)
  const round1Entries = cols[0].flatMap(m => {
      const a = (m?.a && m.a.entry != null) ? String(m.a.entry) : null;
      const b = (m?.b && m.b.entry != null) ? String(m.b.entry) : null;
      return [a, b].filter(x => x !== null);
  });

  // Collect losers per round (ignore pending and byes)
  const losersByRound = cols.map(matches => {
      const losers = [];
      matches.forEach(m => {
      const aName = (m?.a && m.a.entry != null) ? String(m.a.entry) : null;
      const bName = (m?.b && m.b.entry != null) ? String(m.b.entry) : null;

      if (m.pick === 'a' && bName !== null) losers.push(bName);
      else if (m.pick === 'b' && aName !== null) losers.push(aName);
      });
      return losers;
  });

  const out = [];
  const champ = this.getWinner();
  if (champ) out.push(champ);

  // Finalist (loser of the last round), if any
  const finalLosers = losersByRound[losersByRound.length - 1] || [];
  if (finalLosers[0]) out.push(finalLosers[0]);

  // Earlier rounds losers: later-round losers rank higher
  for (let r = losersByRound.length - 2; r >= 0; r--) {
      losersByRound[r].forEach(name => { if (!out.includes(name)) out.push(name); });
  }

  // Add any still-missing round-1 entries at the end (e.g., unplayed when user stops early)
  round1Entries.forEach(name => { if (name && !out.includes(name)) out.push(name); });

  return out;
  },
  // === END robust ranking ===

  serialize(){ return cols; }
  };
}


function scoreFromRanking(_ranking, cols){
  // === BEGIN round-based scoring (2^(roundReached-1)) ===
  // Lose in Round 1 → 1, Round 2 → 2, Round 3 → 4, … Champion (final round R) → 2^(R-1)
  const totalRounds = cols.length;
  const roundReached = new Map(); // name -> highest round reached (1-based)
  const namesFrom = m => {
    const a = (m && m.a && m.a.entry != null) ? String(m.a.entry) : null;
    const b = (m && m.b && m.b.entry != null) ? String(m.b.entry) : null;
    return {a,b};
  };

  // Start everyone we see in Round 1 at least at round 1
  (cols[0] || []).forEach(m => {
    const {a,b} = namesFrom(m);
    if (a) roundReached.set(a, Math.max(1, roundReached.get(a) || 0));
    if (b) roundReached.set(b, Math.max(1, roundReached.get(b) || 0));
  });

  // For each decided match:
  //  - loser reached this round (rIdx+1)
  //  - winner reached at least next round (rIdx+2)
  cols.forEach((round, rIdx) => {
    round.forEach(m => {
      const {a,b} = namesFrom(m);
      if (m.pick === 'a' || m.pick === 'b') {
        const winner = (m.pick === 'a') ? a : b;
        const loser  = (m.pick === 'a') ? b : a;

        if (loser)  roundReached.set(loser, Math.max(roundReached.get(loser)||1, rIdx + 1));
        if (winner) roundReached.set(winner, Math.max(roundReached.get(winner)||1, rIdx + 2));
      }
    });
  });

  // Final round may be single-slot (no pick): infer champion
  const last = (cols[totalRounds - 1] || [])[0];
  if (last) {
    const {a,b} = namesFrom(last);
    if (!last.pick) {
      const aHas = !!a, bHas = !!b;
      if (aHas && !bHas) roundReached.set(a, Math.max(roundReached.get(a)||1, totalRounds));
      if (bHas && !aHas) roundReached.set(b, Math.max(roundReached.get(b)||1, totalRounds));
    } else {
      // already handled above, but ensure champ reaches final round
      const champ = (last.pick === 'a') ? a : b;
      if (champ) roundReached.set(champ, Math.max(roundReached.get(champ)||1, totalRounds));
    }
  }

  // Convert to scores: 2^(roundReached-1)
  const scores = {};
  for (const [name, round] of roundReached.entries()) {
    scores[name] = Math.pow(2, Math.max(1, round) - 1);
  }
  return scores;
  // === END round-based scoring ===
}

// === Image lightbox (click an entry image to view it large) ===
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightboxImg');
const lightboxCaption = document.getElementById('lightboxCaption');
// position:fixed anchors to the LAYOUT viewport; under pinch-zoom the visible
// (VISUAL) viewport is a smaller, panned subset. Pin + counter-scale the overlay
// to the visual viewport so it always covers exactly what the user sees.
function positionLightbox(){
  const vv = window.visualViewport;
  if (!vv) return; // older browsers: CSS full-screen fallback applies
  lightbox.style.transformOrigin = '0 0';
  lightbox.style.width  = (vv.width  * vv.scale) + 'px'; // == layout viewport size
  lightbox.style.height = (vv.height * vv.scale) + 'px';
  lightbox.style.transform =
    `translate(${vv.offsetLeft}px, ${vv.offsetTop}px) scale(${1 / vv.scale})`;
}
function openLightbox(src, caption){
  lightboxImg.src = src;
  lightboxImg.alt = caption || '';
  lightboxCaption.textContent = caption || '';
  lightbox.style.display = 'flex';
  document.body.style.overflow = 'hidden'; // lock background scroll while open
  positionLightbox();
  if (window.visualViewport){
    window.visualViewport.addEventListener('resize', positionLightbox);
    window.visualViewport.addEventListener('scroll', positionLightbox);
  }
}
function closeLightbox(){
  lightbox.style.display = 'none';
  lightboxImg.removeAttribute('src');
  document.body.style.overflow = '';
  // clear inline overrides so the CSS fallback applies next time
  lightbox.style.transform = '';
  lightbox.style.width = '';
  lightbox.style.height = '';
  if (window.visualViewport){
    window.visualViewport.removeEventListener('resize', positionLightbox);
    window.visualViewport.removeEventListener('scroll', positionLightbox);
  }
}
lightbox.onclick = closeLightbox;
document.addEventListener('keydown', (e)=>{
  if (e.key === 'Escape' && lightbox.style.display !== 'none') closeLightbox();
});


function show(id, vis){ document.getElementById(id).style.display = vis ? 'block' : 'none'; }


async function loadCode(code){
const res = await fetchSet(code);
if (!res.ok) { playMsg.textContent='Code not found.'; return; }
show('createCard', false);
show('playCard', true);
show('statsCard', true);
qText.textContent = res.question || code;

// Map entry name -> image URL, used only at render time.
const imgByName = {};
(res.entries || []).forEach(e => { if (e && e.name) imgByName[e.name] = e.img || null; });
const entryNames = (res.entries || []).map(e => e.name);

let ui;
let alreadySubmitted = false;

// First check localStorage for a saved bracket (faster, works offline)
const savedBracket = getSavedBracket(code);
const savedRanking = getSavedRanking(code);

if (hasSubmitted(code) && savedBracket) {
  // User has submitted from this device - show their bracket in read-only mode
  ui = renderBracket(bracketEl, savedBracket, true, true, imgByName);
  bracketEl.classList.add('readonly');
  reviewBanner.style.display = 'flex';
  alreadySubmitted = true;

  submitBtn.disabled = true;
  submitBtn.textContent = 'View Your Picks';
  if (savedRanking && savedRanking.length) {
    playMsg.textContent = `Your picks: ${savedRanking.join(' → ')}`;
  } else {
    playMsg.textContent = 'Viewing your submitted bracket.';
  }
} else {
  // Try to fetch from server (in case user submitted from another device)
  try {
    const mine = await fetchMyPicks(code, PLAYER_ID);
    if (mine.ok && mine.found && mine.bracket) {
      // Rebuild the same matchups and auto-apply picks in read-only mode
      ui = renderBracket(bracketEl, mine.bracket, true, true, imgByName);
      bracketEl.classList.add('readonly');
      reviewBanner.style.display = 'flex';
      alreadySubmitted = true;

      submitBtn.disabled = true;
      submitBtn.textContent = 'View Your Picks';
      if (mine.ranking && mine.ranking.length) {
        playMsg.textContent = `Your picks: ${mine.ranking.join(' → ')}`;
      } else {
        playMsg.textContent = 'Viewing your submitted bracket.';
      }

      // Cache it locally for faster future loads
      rememberPicks(code, mine.ranking, mine.bracket);
    } else {
      // No previous picks: build a fresh random bracket
      const seedStr = `${code}:${Date.now()}:${Math.random()}`;
      const rounds = buildBracket(entryNames, seedStr);
      ui = renderBracket(bracketEl, rounds, false, false, imgByName);
    }
  } catch (e) {
    // If my_picks fails for any reason, fall back to a fresh bracket
    const seedStr = `${code}:${Date.now()}:${Math.random()}`;
    const rounds = buildBracket(entryNames, seedStr);
    ui = renderBracket(bracketEl, rounds, false, false, imgByName);
  }
}

// Reset submit button state for new brackets
if (!alreadySubmitted) {
  submitBtn.disabled = false;
  submitBtn.textContent = 'Submit';
  playMsg.textContent = '';
  bracketEl.classList.remove('readonly');
  reviewBanner.style.display = 'none';
}

// (existing, do not delete)
submitBtn.onclick = async () => {
  // Block repeat submits in this browser
  if (hasSubmitted(code)) {
    submitBtn.disabled = true;
    submitBtn.textContent = 'Already submitted';
    const saved = getSavedRanking(code);
    if (saved && saved.length) {
      playMsg.textContent = `You already submitted: ${saved.join(' → ')}`;
    } else {
      playMsg.textContent = 'You already submitted a bracket on this device.';
    }
    return;
  }

  const ranking = ui.getRanking();
  if (!ranking[0]) { playMsg.textContent='Pick winners first!'; return; }

  // Disable button to prevent double click
  submitBtn.disabled = true;
  submitBtn.textContent = 'Submitting…';

  const bracketCols = ui.serialize();
  const scores = scoreFromRanking(ranking, bracketCols);

  const out = await submitPicks(code, PLAYER_ID, bracketCols, ranking, scores);
  if (out.ok) {
    rememberPicks(code, ranking, bracketCols); // store locally with bracket
    playMsg.textContent=`Submitted! Your picks: ${ranking.join(' → ')}`;
    submitBtn.textContent = 'View Your Picks';
    show('statsCard', true);
    const agg = await fetchStats(code);
    renderStats(agg);
  } else if (out.duplicate) {
    // Already submitted (server-side unique constraint) — treat as success.
    rememberPicks(code, ranking, bracketCols);
    playMsg.textContent=`You already submitted: ${ranking.join(' → ')}`;
    submitBtn.textContent = 'View Your Picks';
    const agg = await fetchStats(code);
    renderStats(agg);
  } else {
    playMsg.textContent='Submit failed.';
    submitBtn.disabled = false;
    submitBtn.textContent = 'Submit';
  }
};



const agg = await fetchStats(code);
renderStats(agg);
}


function renderStats(agg){
const box = document.getElementById('stats');
if (!agg.ok){ box.textContent='No stats yet.'; return; }
const rows = agg.aggregate||[];
box.innerHTML = rows.map((r,i)=>`<div>${i+1}. <b>${r.entry}</b> — total score ${r.totalScore} ${r.avgRank?`(avg rank ${r.avgRank.toFixed(2)})`:''} · n=${r.samples}</div>`).join('');
}


// Button reads "Create" when the box is empty, "Load" once a code is typed.
function syncLoadBtnLabel(){
  loadBtn.textContent = (codeInput.value||'').trim() ? 'Load' : 'Create';
}
codeInput.addEventListener('input', syncLoadBtnLabel);
syncLoadBtnLabel();

loadBtn.onclick = async ()=>{
const code = (codeInput.value||'').trim().toUpperCase();
if (!code){ show('createCard', true); show('playCard', false); show('statsCard', false); return; }
await loadCode(code);
};


// === Create-bracket entry rows (name + image upload/URL) ===
let entryRows = []; // [{ id, name, file, url, objectUrl }]

function newRowId(){
  return (crypto.randomUUID ? crypto.randomUUID()
    : 'r_' + Date.now().toString(36) + Math.random().toString(36).slice(2,8));
}

function setRowFile(row, file){
  if (row.objectUrl) { URL.revokeObjectURL(row.objectUrl); row.objectUrl = null; }
  row.file = file || null;
  row.objectUrl = file ? URL.createObjectURL(file) : null;
  if (file) row.url = ''; // an uploaded file wins over a pasted URL
  renderEntryRows();
}

function rowThumbSrc(row){
  return row.objectUrl || (row.url && row.url.trim()) || null;
}

function renderEntryRows(){
  entryListEl.innerHTML = '';
  entryRows.forEach(row => {
    const el = document.createElement('div');
    el.className = 'entry-row';

    const thumb = document.createElement('img');
    thumb.className = 'thumb';
    const src = rowThumbSrc(row);
    if (src) thumb.src = src; else thumb.style.visibility = 'hidden';

    const name = document.createElement('input');
    name.className = 'name';
    name.placeholder = 'Entry name';
    name.value = row.name;
    name.oninput = () => { row.name = name.value; };

    const fileBtn = document.createElement('button');
    fileBtn.type = 'button';
    fileBtn.className = 'filebtn';
    fileBtn.textContent = row.file ? '✓ Image' : '📷 Upload';

    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.accept = 'image/png,image/jpeg,image/webp,image/gif';
    fileInput.style.display = 'none';
    fileInput.onchange = () => { if (fileInput.files[0]) setRowFile(row, fileInput.files[0]); };
    fileBtn.onclick = () => fileInput.click();

    const url = document.createElement('input');
    url.type = 'url';
    url.className = 'url';
    url.placeholder = '…or paste image URL';
    url.value = row.url;
    url.disabled = !!row.file;
    url.oninput = () => { row.url = url.value; thumb.style.visibility = rowThumbSrc(row) ? 'visible' : 'hidden'; thumb.src = rowThumbSrc(row) || ''; };

    const removeBtn = document.createElement('button');
    removeBtn.type = 'button';
    removeBtn.className = 'removebtn';
    removeBtn.textContent = '✕';
    removeBtn.title = 'Remove entry';
    removeBtn.onclick = () => {
      if (row.objectUrl) URL.revokeObjectURL(row.objectUrl);
      entryRows = entryRows.filter(r => r.id !== row.id);
      renderEntryRows();
    };

    // Drag & drop an image file onto the row
    el.ondragover = (e) => { e.preventDefault(); el.classList.add('dragover'); };
    el.ondragleave = () => el.classList.remove('dragover');
    el.ondrop = (e) => {
      e.preventDefault(); el.classList.remove('dragover');
      const f = e.dataTransfer.files && e.dataTransfer.files[0];
      if (f && f.type.startsWith('image/')) setRowFile(row, f);
    };

    el.append(thumb, name, fileBtn, fileInput, url, removeBtn);
    entryListEl.appendChild(el);
  });
}

function addEntryRow(){
  entryRows.push({ id: newRowId(), name: '', file: null, url: '', objectUrl: null });
  renderEntryRows();
}

addEntryBtn.onclick = () => addEntryRow();

function extFor(file){
  const fromType = { 'image/png':'png', 'image/jpeg':'jpg', 'image/webp':'webp', 'image/gif':'gif' }[file.type];
  if (fromType) return fromType;
  const m = /\.([a-z0-9]+)$/i.exec(file.name || '');
  return m ? m[1].toLowerCase() : 'img';
}

// Seed the create form with a couple of blank rows.
addEntryRow();
addEntryRow();


createBtn.onclick = async ()=>{
  if (createBtn.disabled) return; // guard
  const question = (questionEl.value||'').trim().slice(0, 200);

  // Collect named rows, dedupe by name (first occurrence wins).
  const seen = new Set();
  const rows = [];
  for (const row of entryRows) {
    const nm = (row.name||'').trim();
    if (!nm || seen.has(nm)) continue;
    seen.add(nm);
    rows.push(row);
  }
  if (rows.length < 2) {
    createMsg.textContent = 'Need at least two entries (with names).';
    return;
  }

  createBtn.disabled = true;
  const originalText = createBtn.textContent;
  createBtn.textContent = 'Creating…';

  try {
    const entries = [];
    for (let k = 0; k < rows.length; k++) {
      const row = rows[k];
      let img = null;
      if (row.file) {
        createMsg.textContent = `Uploading images… (${k+1}/${rows.length})`;
        const path = `entries/${newRowId()}.${extFor(row.file)}`;
        const { error: upErr } = await sb.storage.from(IMAGE_BUCKET)
          .upload(path, row.file, { contentType: row.file.type, upsert: false });
        if (upErr) throw new Error('Image upload failed: ' + upErr.message);
        img = sb.storage.from(IMAGE_BUCKET).getPublicUrl(path).data.publicUrl;
      } else if ((row.url||'').trim()) {
        img = row.url.trim();
      }
      entries.push({ name: row.name.trim(), img });
    }

    createMsg.textContent = 'Creating bracket…';
    const out = await createSet(question, entries);
    if (!out.ok) throw new Error(out.error || 'Failed to create.');

    createMsg.innerHTML = `Code: <b>${out.code}</b> — share this!`;
    codeInput.value = out.code;
    try {
      localStorage.setItem(`br_created_${out.code}`, JSON.stringify({question, entries}));
    } catch(e){}
    await loadCode(out.code);
  } catch (e) {
    createMsg.textContent = e.message || 'Failed to create.';
    createBtn.disabled = false;
    createBtn.textContent = originalText;
  }
};


async function loadBrowse(){
const res = await fetchBrowse();
if (!res.ok){ return; }
browseCard.style.display='block';
recentEl.innerHTML = res.rows.map(r=>`<li style="margin:6px 0"><a href="#" data-code="${r.code}"><b>${r.question||r.code}</b></a> <span style="color:var(--muted)">(${r.entries.length} entries)</span></li>`).join('');
recentEl.querySelectorAll('a').forEach(a=>a.onclick=(e)=>{e.preventDefault(); codeInput.value=a.dataset.code; syncLoadBtnLabel(); loadBtn.click();});
}


// Show recent brackets by default on the home page.
loadBrowse();

// Deep link ?code=FOO
const urlParams = new URLSearchParams(location.search);
if (urlParams.get('code')){ codeInput.value = urlParams.get('code').toUpperCase(); syncLoadBtnLabel(); loadBtn.click(); }
